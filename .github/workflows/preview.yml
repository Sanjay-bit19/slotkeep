# Vercel preview deployments for pull requests.
# If the Vercel GitHub app is installed it already does this; this workflow is the CLI-based
# alternative and is a no-op unless VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are set.
name: Preview deploy

on:
  pull_request:

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Vercel is not configured
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN not set; skipping preview deploy."
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with: { node-version: "22" }
      - name: Deploy preview
        if: env.VERCEL_TOKEN != ''
        id: deploy
        run: |
          npm i -g vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment preview URL
        if: env.VERCEL_TOKEN != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `Preview: ${{ steps.deploy.outputs.url }}`,
            });
