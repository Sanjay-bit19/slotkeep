name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.28.0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests (+coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Fails if packages/core coverage drops below 85% (thresholds in vitest.config.ts).
      - run: pnpm test:unit:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/, retention-days: 7 }

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: slotkeep_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/slotkeep_test?schema=public&connection_limit=30
      REDIS_URL_TEST: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: slotkeep_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Real Stripe test mode runs when these secrets exist (plus `stripe listen` forwarding);
      # otherwise the signed-webhook payment simulator is used.
      STRIPE_E2E: ${{ secrets.STRIPE_E2E_SECRET_KEY != '' && '1' || '' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_E2E_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @slotkeep/web exec playwright install --with-deps chromium
      - name: Forward Stripe webhooks (real Stripe mode only)
        if: env.STRIPE_E2E == '1'
        run: |
          curl -sSL https://github.com/stripe/stripe-cli/releases/download/v1.21.8/stripe_1.21.8_linux_x86_64.tar.gz | tar xz
          ./stripe listen --api-key "$STRIPE_SECRET_KEY" --print-secret > whsec.txt
          echo "STRIPE_WEBHOOK_SECRET=$(cat whsec.txt)" >> "$GITHUB_ENV"
          nohup ./stripe listen --api-key "$STRIPE_SECRET_KEY" --forward-to localhost:3100/api/webhooks/stripe > stripe.log 2>&1 &
      - name: Build web
        run: pnpm --filter @slotkeep/web build
      - name: Run Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report/, retention-days: 7 }

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          {
            context: .,
            target: web,
            push: false,
            cache-from: type=gha,
            cache-to: "type=gha,mode=max",
          }
      - uses: docker/build-push-action@v6
        with: { context: ., target: worker, push: false, cache-from: type=gha }

  sentry-release:
    name: Sentry release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, integration, e2e]
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Create release and associate commits
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        with:
          environment: production
          projects: slotkeep-web slotkeep-worker
          version: ${{ github.sha }}
